name: PostgreSQL integration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_NAME: dataflow_test
      DB_USER: dataflow_ci
      DB_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dataflow_ci
          POSTGRES_DB: dataflow_test
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dataflow_ci -d dataflow_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Ensure secret is configured
        run: |
          if [ -z "$DB_PASSWORD" ]; then
            echo "::error::Configure the CI_POSTGRES_PASSWORD Actions repository secret."
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install test dependencies
        run: python -m pip install -e '.[test,postgres]'
      - name: Run PostgreSQL integration tests
        run: |
          mkdir -p artifacts
          python -m pytest tests/integration -v --junitxml=artifacts/postgres-tests.xml
      - name: Upload sanitized test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: postgres-integration-results
          path: artifacts/postgres-tests.xml
          if-no-files-found: warn
          retention-days: 14
