name: NexaRetail end-to-end

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_NAME: dataflow_pipeline
      DB_USER: dataflow_ci
      DB_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dataflow_ci
          POSTGRES_DB: dataflow_pipeline
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dataflow_ci -d dataflow_pipeline"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check database password configuration
        run: |
          if [ -z "$DB_PASSWORD" ]; then
            echo "::error::Configure CI_POSTGRES_PASSWORD as an Actions secret to connect to PostgreSQL."
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: python -m pip install -e '.[test,postgres]'
      - name: Run unit tests
        run: |
          mkdir -p artifacts/reports
          python -m pytest tests/unit -v --junitxml=artifacts/reports/unit-tests.xml
      - name: Run pipeline
        run: python -m dataflow --workdir ./artifacts
      - name: Verify published report contracts
        run: python -m dataflow.verify --reports ./artifacts/reports
      - name: Upload sanitized reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nexaretail-reports
          path: artifacts/reports/
          if-no-files-found: warn
          retention-days: 14
